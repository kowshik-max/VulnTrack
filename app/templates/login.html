<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VulnTrack · Sign in</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="login-body"><main class="login-card"><div class="brand-mark">VT</div><h1>VulnTrack</h1><p class="muted">Vulnerability management & remediation</p>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<p class="alert">{{ message }}</p>{% endfor %}{% endwith %}<form method="post" action="{{ url_for('login') }}"><label>Username<input name="username" autocomplete="username" required maxlength="80"></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button class="primary full" type="submit">Sign in</button></form><p class="hint">Local demo account: <b>analyst</b> / <b>DemoOnly!ChangeMe</b></p><p class="hint">Change the demo password before using real data.</p></main></body></html>
