<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VulnTrack</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><aside class="sidebar"><div class="logo"><span class="logo-icon">VT</span><span>Vuln<span class="blue">Track</span><small>SECURITY OPERATIONS</small></span></div><nav id="nav"><button data-page="dashboard" class="active">▦ Dashboard</button><button data-page="findings">⌕ Findings</button><button data-page="assets">▤ Assets</button><button data-page="imports">⇧ Import Results</button><button data-page="reports">▧ Reports</button></nav><div class="side-foot"><span class="status-dot"></span> Local application<br><small>Demo records are synthetic</small></div></aside><main class="main"><header class="topbar"><div><div class="eyebrow">VULNERABILITY MANAGEMENT</div><h1 id="page-title">Dashboard</h1></div><div class="user-area"><span class="avatar">{{ username[0]|upper }}</span><span>{{ username }}<small>{{ role }}</small></span><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="ghost" type="submit">Log out</button></form></div></header><div id="notice" aria-live="polite"></div><section id="content"><div class="loading">Loading VulnTrack…</div></section><footer>VulnTrack · Portfolio project · Use only with authorized security assessment data.</footer></main><div id="modal-root"></div><script src="{{ url_for('static', filename='app.js') }}" defer></script></body></html>
